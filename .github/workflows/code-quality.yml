name: Code quality

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

jobs:
  quality:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_VERSION: "3.12"
      JAVA_VERSION: "25"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache QA dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            .temp/qa-runtime
          key: ${{ runner.os }}-qa-cache-py${{ env.PYTHON_VERSION }}-runtime-${{ hashFiles('tools/code_qa/**') }}
          restore-keys: |
            ${{ runner.os }}-qa-cache-py${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-qa-cache-

      - name: Run code quality checks
        run: |
          set -eux
          python tools/code_qa/main.py lint
