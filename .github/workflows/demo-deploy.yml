name: Demo deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-deploy
  cancel-in-progress: false

env:
  SOURCE_BRANCH: deploy/demo
  GITOPS_BRANCH: deploy/demo-gitops

jobs:
  quality:
    name: Verify repository
    if: github.ref == 'refs/heads/deploy/demo'
    uses: ./.github/workflows/code-quality.yml
    permissions:
      contents: read

  plan-images:
    name: Select images missing from GHCR
    if: github.ref == 'refs/heads/deploy/demo'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image tags and select unpublished images
        id: plan
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 deploy/demo/image_tags.py plan

  build-and-publish:
    name: Build & publish / ${{ matrix.service }}
    if: github.ref == 'refs/heads/deploy/demo' && needs.plan-images.outputs.has_changes == 'true'
    needs: plan-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-images.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy published images using SSM
    if: >-
      always() && github.ref == 'refs/heads/deploy/demo' &&
      needs.plan-images.result == 'success' &&
      (needs.build-and-publish.result == 'success' ||
      (needs.plan-images.outputs.has_changes == 'false' && needs.build-and-publish.result == 'skipped'))
    needs: [plan-images, build-and-publish]
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEMO_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: aggregator-demo-deploy

      - name: Trigger and verify deployment
        run: bash ./deploy/demo/dispatch-ssm.sh
        env:
          SSM_INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}

  publish-k3s-release:
    name: Publish K3s release in demo
    if: >-
      always() && github.ref == 'refs/heads/deploy/demo' &&
      needs.plan-images.result == 'success' &&
      (needs.build-and-publish.result == 'success' ||
      (needs.plan-images.outputs.has_changes == 'false' && needs.build-and-publish.result == 'skipped'))
    needs: [plan-images, build-and-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.33.3

      - name: Promote the tested manifests and image tags
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash .github/scripts/demo-deploy/publish-k3s-release.sh
