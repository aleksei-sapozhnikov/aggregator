name: Demo deploy

on:
  push:
    branches: [demo]
    paths-ignore:
      - "deploy/infra/demo/**"
      - "deploy/ansible/**"
      - ".github/workflows/demo-infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Verify repository
    if: github.ref == 'refs/heads/demo'
    uses: ./.github/workflows/code-quality.yml
    permissions:
      contents: read

  build-and-publish:
    name: Build & publish / ${{ matrix.service }}
    if: github.ref == 'refs/heads/demo'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: aggregator
            context: services-core/aggregator
          - service: aggregator-ui
            context: services-core/aggregator-ui
          - service: catalog
            context: services-core/catalog
          - service: ai-agent
            context: services-core/ai-agent
          - service: chaos-maker
            context: services-demo/chaos-maker
          - service: dummy-java
            context: services-demo/dummy-java
          - service: dummy-python
            context: services-demo/dummy-python
          - service: dummy-javascript
            context: services-demo/dummy-javascript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy published images using SSM
    if: github.ref == 'refs/heads/demo'
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEMO_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: aggregator-demo-deploy

      - name: Trigger and verify deployment
        run: bash ./deploy/demo/dispatch-ssm.sh
        env:
          SSM_INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}

  publish-k3s-release:
    name: Publish immutable K3s GitOps release
    if: github.ref == 'refs/heads/demo'
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exactly the already-built image tags
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin refs/heads/k3s-demo:refs/remotes/origin/k3s-demo; then
            git switch --create k3s-demo --track origin/k3s-demo
          else
            git switch --create k3s-demo
          fi
          # The manifest snapshot must come from the same source SHA as the images.
          git checkout "$RELEASE_SHA" -- deploy/k8s
          python3 - "$RELEASE_SHA" <<'PY'
          from pathlib import Path
          import re
          import sys

          revision = sys.argv[1]
          path = Path("deploy/k8s/kustomization.yaml")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^(\s*newTag: )[^\s]+$",
              lambda match: match.group(1) + revision,
              content,
          )
          if count != 8:
              raise SystemExit(f"Expected 8 image tags, found {count}")
          path.write_text(updated, encoding="utf-8")
          PY
          git add deploy/k8s
          git diff --cached --quiet || git commit -m "Deploy K3s images from $RELEASE_SHA"
          git push origin HEAD:refs/heads/k3s-demo
          echo "GitOps K3s release: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
