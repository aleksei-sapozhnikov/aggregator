name: Demo deploy

on:
  push:
    branches: [demo]
    paths-ignore:
      - "deploy/infra/demo/**"
      - "deploy/ansible/**"
      - "deploy/k8s-live/**"
      - ".github/workflows/demo-infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Verify repository
    if: github.ref == 'refs/heads/demo'
    uses: ./.github/workflows/code-quality.yml
    permissions:
      contents: read

  build-and-publish:
    name: Build & publish / ${{ matrix.service }}
    if: github.ref == 'refs/heads/demo'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: aggregator
            context: services-core/aggregator
          - service: aggregator-ui
            context: services-core/aggregator-ui
          - service: catalog
            context: services-core/catalog
          - service: ai-agent
            context: services-core/ai-agent
          - service: chaos-maker
            context: services-demo/chaos-maker
          - service: dummy-java
            context: services-demo/dummy-java
          - service: dummy-python
            context: services-demo/dummy-python
          - service: dummy-javascript
            context: services-demo/dummy-javascript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy published images using SSM
    if: github.ref == 'refs/heads/demo'
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEMO_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: aggregator-demo-deploy

      - name: Trigger and verify deployment
        run: bash ./deploy/demo/dispatch-ssm.sh
        env:
          SSM_INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}

  publish-k3s-release:
    name: Publish K3s release in demo
    if: github.ref == 'refs/heads/demo'
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.33.3

      - name: Promote the tested manifests and image tags
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reject stale builds: do not promote a release after demo has advanced.
          current_demo_sha="$(git ls-remote origin refs/heads/demo | cut -f1)"
          if [[ "$current_demo_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::demo advanced to $current_demo_sha; refusing to publish stale build $RELEASE_SHA."
            exit 1
          fi

          # Argo CD watches only this generated directory, not the candidate manifests.
          # Copy from the exact revision used to build all eight GHCR images.
          git switch --create published-k3s "$RELEASE_SHA"
          rm -rf deploy/k8s-live
          cp -a deploy/k8s deploy/k8s-live

          # Match Grafana/Prometheus provisioning to the same source revision.
          cp services-extra/grafana/dashboards/item_health_state.json deploy/k8s-live/item_health_state.json
          cp services-extra/grafana/provisioning/dashboards/dashboards.yaml deploy/k8s-live/dashboards.yaml
          cp services-extra/grafana/provisioning/datasources/prometheus.yaml deploy/k8s-live/prometheus.yaml
          cp services-extra/prometheus/prometheus.yml deploy/k8s-live/prometheus.yml

          python3 - "$RELEASE_SHA" <<'PY'
          from pathlib import Path
          import re
          import sys

          revision = sys.argv[1]
          manifest = Path("deploy/k8s-live/kustomization.yaml")
          content = manifest.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^(\s*newTag: )[^\s]+$",
              lambda match: match.group(1) + revision,
              content,
          )
          if count != 8:
              raise SystemExit(f"Expected 8 image tags, found {count}")
          manifest.write_text(updated, encoding="utf-8")
          PY

          kubectl kustomize deploy/k8s-live > "$RUNNER_TEMP/k3s-rendered.yaml"
          if grep -q ':unpublished' "$RUNNER_TEMP/k3s-rendered.yaml"; then
            echo "::error::Unpublished image tags in the GitOps release."
            exit 1
          fi

          git add -A deploy/k8s-live
          if git diff --cached --quiet; then
            echo "Published K3s manifests already match $RELEASE_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Publish K3s manifests for $RELEASE_SHA"
            # A non-fast-forward push must fail rather than overwrite a newer release.
            git push origin HEAD:refs/heads/demo
            echo "K3s release $RELEASE_SHA published to demo:deploy/k8s-live." >> "$GITHUB_STEP_SUMMARY"
          fi
