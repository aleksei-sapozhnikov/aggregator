name: Demo infrastructure

on:
  push:
    branches: [demo]
    paths-ignore:
      - "deploy/k8s-live/**"
  workflow_dispatch:
    inputs:
      reapply_ansible:
        description: "Reapply Ansible after the infrastructure check"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: aggregator-demo-infra
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  detect:
    name: Route demo changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      infra_changed: ${{ steps.route.outputs.infra_changed }}
      deploy_changed: ${{ steps.route.outputs.deploy_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine which stages are required
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          infra_changed=false
          deploy_changed=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # Manual runs are infrastructure reconciliations, not forced image rebuilds.
            infra_changed=true
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            # Fail safe when the push range is unavailable.
            infra_changed=true
            deploy_changed=true
          else
            while IFS= read -r path; do
              case "$path" in
                deploy/infra/demo/*|deploy/ansible/*|.github/workflows/demo-infra.yml)
                  infra_changed=true
                  ;;
                deploy/infra/*|deploy/k8s/README.md|deploy/k8s-live/*|.github/workflows/demo-deploy.yml)
                  # Infrastructure administration, generated releases and docs do not build images.
                  ;;
                ?*)
                  deploy_changed=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          fi
          {
            echo "infra_changed=$infra_changed"
            echo "deploy_changed=$deploy_changed"
          } >> "$GITHUB_OUTPUT"
          echo "Infrastructure changes: $infra_changed"
          echo "Application changes: $deploy_changed"

  validate:
    name: Validate demo OpenTofu and Ansible (no AWS access)
    needs: detect
    if: needs.detect.outputs.infra_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - name: Check OpenTofu formatting and syntax without AWS credentials
        working-directory: deploy/infra/demo
        shell: bash
        run: |
          set -euo pipefail
          tofu fmt -check -recursive
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate
      - name: Check Ansible syntax without an EC2 connection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --disable-pip-version-check ansible-core==2.21.0
          cd deploy/ansible
          "$RUNNER_TEMP/ansible/bin/ansible-playbook" -i localhost, -c local --syntax-check site.yml
          cd ../..
          bash -n deploy/ansible/dispatch-ssm.sh
          # The cloud-init wrapper must be valid Bash and never execute Ansible at boot.
          "$RUNNER_TEMP/ansible/bin/python" - <<'PY'
          import os
          from pathlib import Path

          import yaml

          cloud_init = yaml.safe_load(
              Path("deploy/infra/demo/modules/ec2_k3s/cloud-init.yaml.tftpl").read_text(
                  encoding="utf-8"
              )
          )
          if "runcmd" in cloud_init:
              raise SystemExit("K3s cloud-init must not run Ansible at boot")
          wrappers = [
              item
              for item in cloud_init.get("write_files", [])
              if item.get("path") == "/usr/local/sbin/aggregator-node-configure"
          ]
          if len(wrappers) != 1:
              raise SystemExit("K3s cloud-init must install exactly one Ansible wrapper")
          Path(os.environ["RUNNER_TEMP"], "aggregator-node-configure.sh").write_text(
              wrappers[0]["content"], encoding="utf-8"
          )
          PY
          bash -n "$RUNNER_TEMP/aggregator-node-configure.sh"

  plan:
    name: Plan changes to demo only
    needs: [detect, validate]
    if: github.ref == 'refs/heads/demo' && needs.detect.outputs.infra_changed == 'true' && vars.DEMO_INFRA_WORKFLOW_ENABLED == 'true'
    environment: demo-infra-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      ansible_changed: ${{ steps.changes.outputs.ansible_changed }}
      k3s_created: ${{ steps.plan.outputs.k3s_created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require explicitly configured demo flags
        shell: bash
        env:
          ENABLE_K3S_NODE: ${{ vars.ENABLE_K3S_NODE }}
          ENABLE_BEDROCK: ${{ vars.ENABLE_BEDROCK }}
        run: |
          set -euo pipefail
          [[ "$ENABLE_K3S_NODE" == true || "$ENABLE_K3S_NODE" == false ]] || {
            echo "::error::ENABLE_K3S_NODE must be explicitly true or false."
            exit 1
          }
          [[ "$ENABLE_BEDROCK" == true || "$ENABLE_BEDROCK" == false ]] || {
            echo "::error::ENABLE_BEDROCK must be explicitly true or false."
            exit 1
          }
          {
            echo "TF_VAR_enable_k3s_node=$ENABLE_K3S_NODE"
            echo "TF_VAR_enable_bedrock=$ENABLE_BEDROCK"
          } >> "$GITHUB_ENV"
      - name: Detect Ansible changes in demo
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          MANUAL_REAPPLY: ${{ inputs.reapply_ansible }}
        run: |
          set -euo pipefail
          changed=false
          reason="No Ansible source changes detected."
          : > "$RUNNER_TEMP/ansible-changed-files.txt"
          : > "$RUNNER_TEMP/ansible-diff.patch"

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$MANUAL_REAPPLY" == true ]]; then
              changed=true
              reason="Manual Ansible reapply requested; this run has no push-to-push Git diff."
            fi
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            changed=true
            reason="Previous commit unavailable for comparison; conservatively reapplying Ansible."
          else
            git diff --name-status "$BASE_SHA" "$GITHUB_SHA" -- deploy/ansible/ > "$RUNNER_TEMP/ansible-changed-files.txt"
            if [[ -s "$RUNNER_TEMP/ansible-changed-files.txt" ]]; then
              changed=true
              reason="Ansible sources changed between $BASE_SHA and $GITHUB_SHA."
              git diff --no-ext-diff --no-color "$BASE_SHA" "$GITHUB_SHA" -- deploy/ansible/ > "$RUNNER_TEMP/ansible-diff.patch"
            fi
          fi

          printf '%s\n' "$reason" > "$RUNNER_TEMP/ansible-change-reason.txt"
          echo "ansible_changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Use read-only OIDC role for planning
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: aggregator-demo-infra-plan
      - name: Confirm the intended AWS account
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 905418096305 ]]
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - name: Initialize demo backend
        working-directory: deploy/infra/demo
        run: tofu init -input=false -lockfile=readonly
      - name: Save plan and render Terraform summary
        id: plan
        working-directory: deploy/infra/demo
        shell: bash
        run: |
          set -euo pipefail
          set +e
          tofu plan -input=false -no-color -detailed-exitcode -out="$RUNNER_TEMP/demo.tfplan" > "$RUNNER_TEMP/plan.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/plan.log"
          if [[ "$status" != 0 && "$status" != 2 ]]; then exit "$status"; fi
          if [[ "$status" == 2 ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          # Detect both first-time creation and replacement using the saved plan.
          k3s_created="$(tofu show -json "$RUNNER_TEMP/demo.tfplan" | jq -r '
            [.resource_changes[]?
              | select(.address == "module.aggregator_demo_k3s[0].aws_instance.this")
              | .change.actions[]?
              | select(. == "create")]
            | length > 0
          ')"
          echo "k3s_created=$k3s_created" >> "$GITHUB_OUTPUT"
          tofu show -no-color "$RUNNER_TEMP/demo.tfplan" > "$RUNNER_TEMP/plan.txt"

      - name: Explain Terraform and Ansible actions for approval
        shell: bash
        env:
          TERRAFORM_CHANGED: ${{ steps.plan.outputs.has_changes }}
          ANSIBLE_CHANGED: ${{ steps.changes.outputs.ansible_changed }}
          K3S_CREATED: ${{ steps.plan.outputs.k3s_created }}
        run: |
          set -euo pipefail
          {
            echo "## Demo infrastructure - approval review"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "### What happens after approval"
            if [[ "$TERRAFORM_CHANGED" == true ]]; then
              echo "- **Terraform:** Apply the exact saved plan displayed below."
            else
              echo "- **Terraform:** No infrastructure changes. Terraform Apply will be skipped."
            fi
            if [[ "$ANSIBLE_CHANGED" == true || "$K3S_CREATED" == true ]]; then
              echo "- **Ansible:** Reapply the playbook over AWS SSM to the K3s EC2 (if provisioned). This can change packages, services and Kubernetes configuration."
            else
              echo "- **Ansible:** No run required; the K3s EC2 is not being created or reconfigured."
            fi
            if [[ "$ANSIBLE_CHANGED" == true || "$K3S_CREATED" == true ]]; then
              echo "- **Initial application release:** After Ansible succeeds, request the existing \`demo-deploy\` workflow only if published K3s manifests are missing."
            fi
            echo
            if [[ "$TERRAFORM_CHANGED" == true && "$ANSIBLE_CHANGED" == true ]]; then
              echo "**Why approval is required:** Both Terraform and Ansible changes were detected."
            elif [[ "$TERRAFORM_CHANGED" == true ]]; then
              echo "**Why approval is required:** Terraform plans infrastructure changes."
            elif [[ "$ANSIBLE_CHANGED" == true ]]; then
              echo "**Why approval is required:** Ansible will be reapplied, even though Terraform has no changes."
            else
              echo "**No approval required:** Neither Terraform nor Ansible changes were detected."
            fi
            echo
            echo "### Terraform"
            if [[ "$TERRAFORM_CHANGED" == true ]]; then
              echo "Infrastructure changes are planned. Review the details before approving."
            else
              echo "No changes. The saved Terraform plan will not be applied."
            fi
            echo
            echo "<details>"
            echo "<summary>Terraform plan (expand to inspect)</summary>"
            echo
            echo '~~~terraform'
            head -c 120000 "$RUNNER_TEMP/plan.txt"
            echo
            if [[ $(wc -c < "$RUNNER_TEMP/plan.txt") -gt 120000 ]]; then
              echo '# Preview truncated at 120 KB. Review the complete plan in the job log.'
            fi
            echo '~~~'
            echo
            echo "</details>"
            echo
            echo "### Ansible"
            if [[ "$ANSIBLE_CHANGED" == true ]]; then
              cat "$RUNNER_TEMP/ansible-change-reason.txt"
              echo
              echo "**Execution:** The existing K3s node is configured through SSM after approval; the playbook runs with root privileges. A Git diff describes source changes, not a remote Ansible check-mode plan."
              if [[ -s "$RUNNER_TEMP/ansible-changed-files.txt" ]]; then
                echo
                echo "Changed source files: $(wc -l < "$RUNNER_TEMP/ansible-changed-files.txt" | tr -d ' '). Expand the Git diff below to review them."
                echo
                echo "<details>"
                echo "<summary>Changed Ansible files and Git diff (expand to inspect)</summary>"
                echo
                echo "**Changed files:**"
                echo
                echo '~~~text'
                cat "$RUNNER_TEMP/ansible-changed-files.txt"
                echo '~~~'
                echo
                echo "**Git diff:**"
                echo
                echo '~~~diff'
                head -c 120000 "$RUNNER_TEMP/ansible-diff.patch"
                echo
                if [[ $(wc -c < "$RUNNER_TEMP/ansible-diff.patch") -gt 120000 ]]; then
                  echo '# Preview truncated at 120 KB. Inspect the full Git diff for the commit range.'
                fi
                echo '~~~'
                echo
                echo "</details>"
              else
                echo
                echo "No push comparison is available for this reapply. Review the selected commit and playbook before approval."
              fi
            elif [[ "$K3S_CREATED" == true ]]; then
              echo "No Ansible source changes detected. Ansible will still configure the newly created or replaced K3s EC2."
            else
              echo "No Ansible changes detected. Ansible will not be run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the exact plan for approval and apply
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: demo-tofu-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo.tfplan
          if-no-files-found: error
          retention-days: 7

  apply:
    name: Approve, apply and configure K3s
    needs: [validate, plan]
    if: github.ref == 'refs/heads/demo' && needs.plan.result == 'success' && (needs.plan.outputs.has_changes == 'true' || needs.plan.outputs.ansible_changed == 'true')
    environment: demo-infra-apply
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
      id-token: write
    outputs:
      k3s_configured: ${{ steps.node.outputs.available }}
    steps:
      - name: Refuse an unconfigured manual approval environment
        shell: bash
        env:
          APPROVAL_CONFIGURED: ${{ vars.MANUAL_APPROVAL_CONFIGURED }}
        run: |
          [[ "$APPROVAL_CONFIGURED" == true ]] || {
            echo "::error::Configure required reviewers for demo-infra-apply, then set its environment variable MANUAL_APPROVAL_CONFIGURED=true."
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Assume write-scoped demo OIDC role after approval
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: aggregator-demo-infra-apply
      - name: Confirm the intended AWS account
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 905418096305 ]]
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - name: Initialize demo backend
        working-directory: deploy/infra/demo
        run: tofu init -input=false -lockfile=readonly
      - name: Download the reviewed saved plan
        if: needs.plan.outputs.has_changes == 'true'
        uses: actions/download-artifact@v8
        with:
          name: demo-tofu-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-plan
      - name: Apply the exact saved plan
        if: needs.plan.outputs.has_changes == 'true'
        working-directory: deploy/infra/demo
        shell: bash
        run: |
          set -euo pipefail
          tofu apply -input=false -no-color "$RUNNER_TEMP/approved-plan/demo.tfplan"
      - name: Find the optional K3s node after successful apply
        if: needs.plan.outputs.k3s_created == 'true' || needs.plan.outputs.ansible_changed == 'true'
        id: node
        working-directory: deploy/infra/demo
        shell: bash
        run: |
          set -euo pipefail
          instance_id="$(tofu output -json k3s_instance_id | jq -r '. // empty')"
          if [[ -z "$instance_id" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Ansible skipped: optional K3s node is not provisioned." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$instance_id" =~ ^i-[a-f0-9]+$ ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected K3s instance ID in OpenTofu output."
            exit 1
          fi
      - name: Apply Ansible and verify K3s using SSM
        if: steps.node.outputs.available == 'true'
        env:
          SSM_INSTANCE_ID: ${{ steps.node.outputs.instance_id }}
          CONFIGURATION_SHA: ${{ github.sha }}
        shell: bash
        run: bash deploy/ansible/dispatch-ssm.sh

  request-demo-deploy:
    name: Request demo application deployment
    needs: [detect, validate, plan, apply]
    if: |
      always() && github.ref == 'refs/heads/demo' &&
      needs.detect.result == 'success' &&
      (
        (needs.detect.outputs.infra_changed == 'false' &&
         needs.validate.result == 'skipped' &&
         needs.plan.result == 'skipped' &&
         needs.apply.result == 'skipped') ||
        (needs.detect.outputs.infra_changed == 'true' &&
         needs.validate.result == 'success' &&
         needs.plan.result == 'success' &&
         (needs.apply.result == 'success' || needs.apply.result == 'skipped'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dispatch the existing demo-deploy workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_CHANGED: ${{ needs.detect.outputs.deploy_changed }}
          INFRA_CHANGED: ${{ needs.detect.outputs.infra_changed }}
        run: |
          set -euo pipefail
          # Read the latest demo branch, including any previously promoted manifests.
          git fetch --no-tags --depth=1 origin refs/heads/demo
          release_missing=false
          if ! git cat-file -e FETCH_HEAD:deploy/k8s-live/kustomization.yaml 2>/dev/null; then
            release_missing=true
          fi
          if [[ "$APP_CHANGED" != true && "$release_missing" != true ]]; then
            echo "No application changes and a K3s release already exists; no demo-deploy needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # All builds, Compose deploys and K3s release promotion stay in demo-deploy.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/demo-deploy.yml/dispatches" -f ref=demo
          echo "Requested demo-deploy after infrastructure stage (infra changed: $INFRA_CHANGED, app changed: $APP_CHANGED, initial release missing: $release_missing)." >> "$GITHUB_STEP_SUMMARY"
          echo "The dispatched workflow reports application deployment success separately." >> "$GITHUB_STEP_SUMMARY"
