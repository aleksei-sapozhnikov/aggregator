name: Demo pipeline

on:
  push:
    branches: [demo]
    paths-ignore:
      - "deploy/k8s-live/**"
  workflow_dispatch:
    inputs:
      reapply_ansible:
        description: "Reapply Ansible after the infrastructure check"
        type: boolean
        default: false
        required: true
      sync_argocd_password:
        description: "Sync Argo CD password from the protected environment secret"
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: aggregator-demo-infra
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  detect:
    name: Route demo changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      infra_changed: ${{ steps.route.outputs.infra_changed }}
      deploy_changed: ${{ steps.route.outputs.deploy_changed }}
      bootstrap_missing: ${{ steps.route.outputs.bootstrap_missing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine which stages are required
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          INFRA_WORKFLOW_ENABLED: ${{ vars.DEMO_INFRA_WORKFLOW_ENABLED }}
        run: bash .github/scripts/demo-infra/route-changes.sh
  validate:
    name: Validate demo OpenTofu and Ansible (no AWS access)
    needs: detect
    if: needs.detect.outputs.infra_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - name: Check OpenTofu formatting and syntax without AWS credentials
        working-directory: deploy/infra/demo
        shell: bash
        run: |
          set -euo pipefail
          tofu fmt -check -recursive
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate
      - name: Check Ansible syntax without an EC2 connection
        shell: bash
        run: bash .github/scripts/demo-infra/check-ansible.sh
  plan:
    name: Plan changes to demo only
    needs: [detect, validate]
    if: github.ref == 'refs/heads/demo' && needs.detect.outputs.infra_changed == 'true' && vars.DEMO_INFRA_WORKFLOW_ENABLED == 'true'
    environment: demo-infra-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      ansible_changed: ${{ steps.changes.outputs.ansible_changed }}
      k3s_created: ${{ steps.plan.outputs.k3s_created }}
      k3s_destroyed: ${{ steps.plan.outputs.k3s_destroyed }}
      k3s_enabled: ${{ steps.flags.outputs.k3s_enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require explicitly configured demo flags
        id: flags
        shell: bash
        env:
          ENABLE_K3S_NODE: ${{ vars.ENABLE_K3S_NODE }}
          ENABLE_BEDROCK: ${{ vars.ENABLE_BEDROCK }}
        run: bash .github/scripts/demo-infra/check-flags.sh
      - name: Detect Ansible changes in demo
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          MANUAL_REAPPLY: ${{ inputs.reapply_ansible }}
          BOOTSTRAP_MISSING: ${{ needs.detect.outputs.bootstrap_missing }}
          K3S_ENABLED: ${{ vars.ENABLE_K3S_NODE }}
        run: bash .github/scripts/demo-infra/detect-ansible-changes.sh
      - name: Use read-only OIDC role for planning
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: aggregator-demo-infra-plan
      - name: Confirm the intended AWS account
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 905418096305 ]]
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - name: Initialize demo backend
        working-directory: deploy/infra/demo
        run: tofu init -input=false -lockfile=readonly
      - name: Save plan and render Terraform summary
        id: plan
        working-directory: deploy/infra/demo
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/demo-infra/plan.sh"
      - name: Explain Terraform and Ansible actions for approval
        shell: bash
        env:
          TERRAFORM_CHANGED: ${{ steps.plan.outputs.has_changes }}
          ANSIBLE_CHANGED: ${{ steps.changes.outputs.ansible_changed }}
          K3S_CREATED: ${{ steps.plan.outputs.k3s_created }}
          PASSWORD_SYNC_REQUESTED: ${{ inputs.sync_argocd_password }}
        run: bash .github/scripts/demo-infra/approval-summary.sh
      - name: Upload the exact plan for approval and apply
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: demo-tofu-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo.tfplan
          if-no-files-found: error
          retention-days: 7

  apply:
    name: Approve, apply and configure K3s
    needs: [validate, plan]
    if: |
      github.ref == 'refs/heads/demo' &&
      needs.plan.result == 'success' &&
      (needs.plan.outputs.has_changes == 'true' ||
       needs.plan.outputs.ansible_changed == 'true' ||
       inputs.sync_argocd_password == true)
    environment: demo-infra-apply
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
      id-token: write
    outputs:
      k3s_configured: ${{ steps.node.outputs.available }}
    steps:
      - name: Refuse an unconfigured manual approval environment
        shell: bash
        env:
          APPROVAL_CONFIGURED: ${{ vars.MANUAL_APPROVAL_CONFIGURED }}
        run: |
          [[ "$APPROVAL_CONFIGURED" == true ]] || {
            echo "::error::Configure required reviewers for demo-infra-apply, then set its environment variable MANUAL_APPROVAL_CONFIGURED=true."
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Assume write-scoped demo OIDC role after approval
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: aggregator-demo-infra-apply
      - name: Confirm the intended AWS account
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 905418096305 ]]
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - name: Initialize demo backend
        working-directory: deploy/infra/demo
        run: tofu init -input=false -lockfile=readonly
      - name: Download the reviewed saved plan
        if: needs.plan.outputs.has_changes == 'true'
        uses: actions/download-artifact@v8
        with:
          name: demo-tofu-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-plan
      - name: Apply the exact saved plan
        if: needs.plan.outputs.has_changes == 'true'
        working-directory: deploy/infra/demo
        shell: bash
        run: |
          set -euo pipefail
          tofu apply -input=false -no-color "$RUNNER_TEMP/approved-plan/demo.tfplan"

      - name: Show infrastructure outputs in GitHub Summary
        working-directory: deploy/infra/demo
        shell: bash
        env:
          TERRAFORM_CHANGED: ${{ needs.plan.outputs.has_changes }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/demo-infra/apply-summary.sh"
      - name: Find the optional K3s node after successful apply
        if: |
          needs.plan.outputs.k3s_created == 'true' ||
          needs.plan.outputs.ansible_changed == 'true' ||
          inputs.sync_argocd_password == true
        id: node
        working-directory: deploy/infra/demo
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/demo-infra/find-k3s-node.sh"
      - name: Require a K3s node for manual password sync
        if: inputs.sync_argocd_password == true && steps.node.outputs.available != 'true'
        run: |
          echo "::error::Cannot sync Argo CD password: K3s is not provisioned."
          exit 1
      - name: Apply Ansible and verify K3s using SSM
        if: steps.node.outputs.available == 'true' && (needs.plan.outputs.k3s_created == 'true' || needs.plan.outputs.ansible_changed == 'true')
        env:
          SSM_INSTANCE_ID: ${{ steps.node.outputs.instance_id }}
          CONFIGURATION_SHA: ${{ github.sha }}
        shell: bash
        run: bash deploy/ansible/dispatch-ssm.sh
      - name: Reconcile Argo CD admin password from protected GitHub secret
        if: steps.node.outputs.available == 'true'
        shell: bash
        env:
          SSM_INSTANCE_ID: ${{ steps.node.outputs.instance_id }}
          ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            boto3==1.40.53 bcrypt==4.3.0
          python3 .github/scripts/demo-infra/sync-argocd-password.py

  request-demo-deploy:
    name: Request demo application deployment
    needs: [detect, validate, plan, apply]
    if: |
      always() && github.ref == 'refs/heads/demo' &&
      needs.detect.result == 'success' &&
      (
        (needs.detect.outputs.infra_changed == 'false' &&
         needs.validate.result == 'skipped' &&
         needs.plan.result == 'skipped' &&
         needs.apply.result == 'skipped') ||
        (needs.detect.outputs.infra_changed == 'true' &&
         needs.validate.result == 'success' &&
         needs.plan.result == 'success' &&
         (needs.apply.result == 'success' || needs.apply.result == 'skipped'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dispatch the existing demo-deploy workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_CHANGED: ${{ needs.detect.outputs.deploy_changed }}
          INFRA_CHANGED: ${{ needs.detect.outputs.infra_changed }}
          K3S_ENABLED: ${{ needs.plan.outputs.k3s_enabled }}
          K3S_DESTROYED: ${{ needs.plan.outputs.k3s_destroyed }}
        run: bash .github/scripts/demo-infra/dispatch-deploy.sh