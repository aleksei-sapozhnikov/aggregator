name: Demo infrastructure

on:
  push:
    branches: [demo]
    paths:
      - ".github/workflows/demo-infra.yml"
      - "deploy/infra/demo/**"
      - "deploy/ansible/**"
  workflow_dispatch:
    inputs:
      reapply_ansible:
        description: "Reapply Ansible after the infrastructure check"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: aggregator-demo-infra
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  validate:
    name: Validate demo OpenTofu and Ansible (no AWS access)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - name: Check OpenTofu formatting and syntax without AWS credentials
        working-directory: deploy/infra/demo
        shell: bash
        run: |
          set -euo pipefail
          tofu fmt -check -recursive
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate
      - name: Check Ansible syntax without an EC2 connection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --disable-pip-version-check ansible-core==2.21.0
          cd deploy/ansible
          "$RUNNER_TEMP/ansible/bin/ansible-playbook" -i localhost, -c local --syntax-check site.yml

  plan:
    name: Plan changes to demo only
    needs: validate
    if: github.ref == 'refs/heads/demo' && vars.DEMO_INFRA_WORKFLOW_ENABLED == 'true'
    environment: demo-infra-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      ansible_changed: ${{ steps.changes.outputs.ansible_changed }}
      k3s_created: ${{ steps.plan.outputs.k3s_created }}
      bootstrap_ref: ${{ steps.flags.outputs.bootstrap_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require explicitly configured demo flags
        id: flags
        shell: bash
        env:
          BOOTSTRAP_REF: ${{ vars.K3S_BOOTSTRAP_GIT_REF }}
          ENABLE_K3S_NODE: ${{ vars.ENABLE_K3S_NODE }}
          ENABLE_BEDROCK: ${{ vars.ENABLE_BEDROCK }}
        run: |
          set -euo pipefail
          [[ "$ENABLE_K3S_NODE" == true || "$ENABLE_K3S_NODE" == false ]] || {
            echo "::error::ENABLE_K3S_NODE must be explicitly true or false."
            exit 1
          }
          [[ "$ENABLE_BEDROCK" == true || "$ENABLE_BEDROCK" == false ]] || {
            echo "::error::ENABLE_BEDROCK must be explicitly true or false."
            exit 1
          }
          if [[ "$ENABLE_K3S_NODE" == true ]]; then
            [[ "$BOOTSTRAP_REF" =~ ^[a-f0-9]{40}$ ]] || {
              echo "::error::Enabled K3s nodes require a pinned K3S_BOOTSTRAP_GIT_REF commit SHA."
              exit 2
            }
            git merge-base --is-ancestor "$BOOTSTRAP_REF" "$GITHUB_SHA" || {
              echo "::error::The K3s bootstrap SHA must belong to the published demo branch history."
              exit 2
            }
          fi
          {
            echo "TF_VAR_enable_k3s_node=$ENABLE_K3S_NODE"
            echo "TF_VAR_enable_bedrock=$ENABLE_BEDROCK"
            if [[ "$ENABLE_K3S_NODE" == true ]]; then
              echo "TF_VAR_k3s_bootstrap_git_ref=$BOOTSTRAP_REF"
            fi
          } >> "$GITHUB_ENV"
          if [[ "$ENABLE_K3S_NODE" == true ]]; then
            echo "bootstrap_ref=$BOOTSTRAP_REF" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect Ansible changes in demo
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          MANUAL_REAPPLY: ${{ inputs.reapply_ansible }}
        run: |
          set -euo pipefail
          changed=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$MANUAL_REAPPLY" != true ]] || changed=true
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            changed=true
          elif git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- deploy/ansible/ | grep -q .; then
            changed=true
          fi
          echo "ansible_changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Use read-only OIDC role for planning
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: aggregator-demo-infra-plan
      - name: Confirm the intended AWS account
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 905418096305 ]]
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - name: Initialize demo backend
        working-directory: deploy/infra/demo
        run: tofu init -input=false -lockfile=readonly
      - name: Save plan and render Terraform summary
        id: plan
        working-directory: deploy/infra/demo
        shell: bash
        run: |
          set -euo pipefail
          set +e
          tofu plan -input=false -no-color -detailed-exitcode -out="$RUNNER_TEMP/demo.tfplan" > "$RUNNER_TEMP/plan.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/plan.log"
          if [[ "$status" != 0 && "$status" != 2 ]]; then exit "$status"; fi
          if [[ "$status" == 2 ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          # Detect both first-time creation and replacement using the saved plan.
          k3s_created="$(tofu show -json "$RUNNER_TEMP/demo.tfplan" | jq -r '
            [.resource_changes[]?
              | select(.address == "module.aggregator_demo_k3s[0].aws_instance.this")
              | .change.actions[]?
              | select(. == "create")]
            | length > 0
          ')"
          echo "k3s_created=$k3s_created" >> "$GITHUB_OUTPUT"
          tofu show -no-color "$RUNNER_TEMP/demo.tfplan" > "$RUNNER_TEMP/plan.txt"
          {
            echo "## Demo infrastructure plan"
            echo "Commit: $GITHUB_SHA"
            echo '```terraform'
            head -c 120000 "$RUNNER_TEMP/plan.txt"
            echo
            if [[ $(wc -c < "$RUNNER_TEMP/plan.txt") -gt 120000 ]]; then
              echo '# Plan output truncated. Review the complete text in the job log.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the exact plan for approval and apply
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: demo-tofu-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo.tfplan
          if-no-files-found: error
          retention-days: 7

  apply:
    name: Approve, apply and reconcile K3s
    needs: [validate, plan]
    if: github.ref == 'refs/heads/demo' && needs.plan.result == 'success' && (needs.plan.outputs.has_changes == 'true' || needs.plan.outputs.ansible_changed == 'true')
    environment: demo-infra-apply
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse an unconfigured manual approval environment
        shell: bash
        env:
          APPROVAL_CONFIGURED: ${{ vars.MANUAL_APPROVAL_CONFIGURED }}
        run: |
          [[ "$APPROVAL_CONFIGURED" == true ]] || {
            echo "::error::Configure required reviewers for demo-infra-apply, then set its environment variable MANUAL_APPROVAL_CONFIGURED=true."
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assume write-scoped demo OIDC role after approval
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: aggregator-demo-infra-apply
      - name: Confirm the intended AWS account
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 905418096305 ]]
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - name: Initialize demo backend
        working-directory: deploy/infra/demo
        run: tofu init -input=false -lockfile=readonly
      - name: Download the reviewed saved plan
        if: needs.plan.outputs.has_changes == 'true'
        uses: actions/download-artifact@v4
        with:
          name: demo-tofu-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-plan
      - name: Apply the exact saved plan
        if: needs.plan.outputs.has_changes == 'true'
        working-directory: deploy/infra/demo
        shell: bash
        run: |
          set -euo pipefail
          tofu apply -input=false -no-color "$RUNNER_TEMP/approved-plan/demo.tfplan"
      - name: Find the optional K3s node after successful apply
        if: needs.plan.outputs.k3s_created == 'true' || needs.plan.outputs.ansible_changed == 'true'
        id: node
        working-directory: deploy/infra/demo
        shell: bash
        run: |
          set -euo pipefail
          instance_id="$(tofu output -json k3s_instance_id | jq -r '. // empty')"
          if [[ -z "$instance_id" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Ansible skipped: optional K3s node is not provisioned." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$instance_id" =~ ^i-[a-f0-9]+$ ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected K3s instance ID in OpenTofu output."
            exit 1
          fi
      - name: Verify first boot or reconcile Ansible using SSM
        if: steps.node.outputs.available == 'true'
        env:
          SSM_INSTANCE_ID: ${{ steps.node.outputs.instance_id }}
          SSM_MODE: ${{ needs.plan.outputs.k3s_created == 'true' && 'verify' || 'reconcile' }}
          CONFIGURATION_SHA: ${{ needs.plan.outputs.k3s_created == 'true' && needs.plan.outputs.bootstrap_ref || github.sha }}
        shell: bash
        run: bash deploy/ansible/dispatch-ssm.sh
