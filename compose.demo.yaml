services:
  aggregator:
    environment:
      JAVA_OPTS: >
        -XX:MaxRAMPercentage=75.0
      SPRING_PROFILES_ACTIVE: demo
    volumes:
      - ./config/demo:/app/config/demo:ro

  chaos-maker:
    build:
      context: chaos-maker
    environment:
      CHAOS_ENABLED: "true"
      CHAOS_MIN_INTERVAL: 10m
      CHAOS_MAX_INTERVAL: 120m
      CHAOS_MIN_DURATION: 15m
      CHAOS_MAX_DURATION: 180m
      CHAOS_MAX_CONCURRENT: "2"
      CHAOS_CHECKS_PATH: /config/demo/health-checks.yaml
    volumes:
      - ./config/demo:/config/demo:ro

  prometheus:
    volumes:
      - ${PROMETHEUS_CONFIG_FILE:-./monitoring/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ANONYMOUS_DEVICE_PREFERENCES: "true"
      GF_SERVER_DOMAIN: "alivion.cc"
      GF_SERVER_ROOT_URL: "https://alivion.cc/health-aggregator/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ${GRAFANA_PROVISIONING_DIR:-./monitoring/grafana/provisioning}:/etc/grafana/provisioning:ro
      - ${GRAFANA_DASHBOARDS_DIR:-./monitoring/grafana/dashboards}:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - grafana

volumes:
  prometheus-data:
  grafana-data:
  caddy_data:
  caddy_config:
