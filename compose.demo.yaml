services:
  aggregator:
    build:
      args:
        CONTAINER_ROOT: services-core/aggregator
        CATALOG_FILE: config/demo/catalog.yaml
        HEALTH_CHECKS_FILE: config/demo/health-checks.yaml
    volumes:
      - ./config/demo:/app/config/demo:ro

  aggregator-ui:
    build:
      context: .
      dockerfile: services-core/aggregator-ui/Dockerfile
      args:
        CONTAINER_ROOT: services-core/aggregator-ui
        CATALOG_FILE: config/demo/catalog.yaml

  chaos-maker:
    build:
      context: chaos-maker
    environment:
      CHAOS_ENABLED: "true"
      CHAOS_MIN_INTERVAL: 30m
      CHAOS_MAX_INTERVAL: 120m
      CHAOS_MIN_DURATION: 5m
      CHAOS_MAX_DURATION: 60m
      CHAOS_MAX_CONCURRENT: "1"
      CHAOS_CHECKS_PATH: /config/demo/health-checks.yaml
    volumes:
      - ./config/demo:/config/demo:ro

  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--storage.tsdb.retention.size=2GB"
    volumes:
      - ${PROMETHEUS_CONFIG_FILE:-./monitoring/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    environment:
      GF_SERVER_DOMAIN: "alivion.cc"
      GF_SERVER_ROOT_URL: "https://aggregator.alivion.cc/grafana"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ANONYMOUS_DEVICE_PREFERENCES: "true"
    volumes:
      - ${GRAFANA_PROVISIONING_DIR:-./monitoring/grafana/provisioning}:/etc/grafana/provisioning:ro
      - ${GRAFANA_DASHBOARDS_DIR:-./monitoring/grafana/dashboards}:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  prometheus-data:
  grafana-data:
  caddy_data:
  caddy_config:
