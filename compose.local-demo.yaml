services:
  aggregator:
    environment:
      FEEDBACK_STORAGE_CONFIG: '{"type":"local","local":{"path":"/home/appuser/feedback/feedback.ndjson"}}'
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      CATALOG_BASE_URL: http://catalog:8080
    volumes:
      - feedback-data:/home/appuser/feedback

  aggregator-ui:
    build:
      context: services-core/aggregator-ui
      args:
        VITE_APP_TITLE: "Health Aggregator LOCAL DEMO"
        VITE_TIMELINE_DEFAULT_RANGE: "15m"

  chaos-maker:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    build:
      context: services-demo/chaos-maker
    environment:
      CHAOS_ENABLED: "true"
      CHAOS_ALWAYS_BROKEN: "true"
      CHAOS_MIN_INTERVAL: 30s
      CHAOS_MAX_INTERVAL: 90s
      CHAOS_MIN_DURATION: 20s
      CHAOS_MAX_DURATION: 45s
      CHAOS_MAX_CONCURRENT: "2"
      CATALOG_SIGNALS_URL: http://catalog:8080/api/signals/http-poll

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ${PROMETHEUS_CONFIG_FILE:-./services-extra/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ANONYMOUS_DEVICE_PREFERENCES: "true"
    volumes:
      - ${GRAFANA_PROVISIONING_DIR:-./services-extra/grafana/provisioning}:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
  feedback-data:
