services:
  aggregator:
    environment:
      JAVA_OPTS: >
        -XX:MaxRAMPercentage=75.0
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      SPRING_PROFILES_ACTIVE: demo
    volumes:
      - ./config/demo:/app/config/demo:ro

  aggregator-ui:
    build:
      context: .
      dockerfile: aggregator-ui/Dockerfile
      args:
        CATALOG_FILE: config/demo/catalog.yaml

  chaos-maker:
    build:
      context: chaos-maker
    environment:
      CHAOS_ENABLED: "true"
      CHAOS_MIN_INTERVAL: 30s
      CHAOS_MAX_INTERVAL: 90s
      CHAOS_MIN_DURATION: 20s
      CHAOS_MAX_DURATION: 45s
      CHAOS_MAX_CONCURRENT: "2"
      CHAOS_CHECKS_PATH: /config/demo/health-checks.yaml
    volumes:
      - ./config/demo:/config/demo:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ${PROMETHEUS_CONFIG_FILE:-./monitoring/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ANONYMOUS_DEVICE_PREFERENCES: "true"
    volumes:
      - ${GRAFANA_PROVISIONING_DIR:-./monitoring/grafana/provisioning}:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
