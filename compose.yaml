services:
  aggregator:
    build:
      context: .
    environment:
      JAVA_OPTS: >
        -XX:MaxRAMPercentage=75.0
    ports:
      - "8080:8080"

  dummy-java:
    build:
      context: ./dummy-services/java
    ports:
      - "8081:8080"

  dummy-python:
    build:
      context: ./dummy-services/python
    ports:
      - "8082:8080"

  dummy-javascript:
    build:
      context: ./dummy-services/javascript
    ports:
      - "8083:8080"
