services:
  aggregator:
    build:
      context: .
    environment:
      JAVA_OPTS: >
        -XX:MaxRAMPercentage=75.0
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=1h"
      - "--storage.tsdb.retention.size=50MB"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.temp/prometheus/data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ANONYMOUS_DEVICE_PREFERENCES: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./.temp/grafana/data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  dummy-java:
    build:
      context: ./dummy-services/java
    ports:
      - "8081:8080"

  dummy-python:
    build:
      context: ./dummy-services/python
    ports:
      - "8082:8080"

  dummy-javascript:
    build:
      context: ./dummy-services/javascript
    ports:
      - "8083:8080"
