services:
  catalog:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    build:
      context: services-core/catalog
    environment:
      CATALOG_DIR: ./catalog/empty
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  aggregator:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    build:
      context: services-core/aggregator
    depends_on:
      catalog:
        condition: service_healthy

  aggregator-ui:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    build:
      context: services-core/aggregator-ui
      args:
        VITE_APP_TITLE: ""
    depends_on:
      catalog:
        condition: service_healthy

  prometheus:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=1h"
      - "--storage.tsdb.retention.size=50MB"
    volumes:
      - ${PROMETHEUS_CONFIG_FILE:-./services-extra/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: grafana/grafana:12.3.1
    environment:
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ${GRAFANA_PROVISIONING_DIR:-./services-extra/grafana/provisioning}:/etc/grafana/provisioning:ro
      - ${GRAFANA_DASHBOARDS_DIR:-./services-extra/grafana/dashboards}:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
