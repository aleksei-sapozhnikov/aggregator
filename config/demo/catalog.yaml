  - sourceId: order-capture-svc
    targetId: order-workflow
    type: depends_on
  - sourceId: order-validation-svc
    targetId: order-workflow
    type: depends_on
  - sourceId: order-billing-svc
    targetId: order-workflow
    type: depends_on

  - sourceId: order-workflow
    targetId: order-dispatch-svc
