# Health checks for demo environment services
checks:
  # Order Capture Service
  - type: http
    checkId: order-capture-ingestion-latency-check
    name: Ingestion latency is within SLO
    catalogItemId: order-capture-svc
    url: http://order-capture-svc:8080/health
    method: GET
    timeout: PT2S

  - type: http
    checkId: order-capture-backlog-size-check
    name: Intake backlog size is under threshold
