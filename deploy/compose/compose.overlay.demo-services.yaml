services:
  catalog:
    environment:
      CATALOG_DIR: ./catalog/demo

  chaos-maker:
    depends_on:
      catalog:
        condition: service_healthy

  dummy-java:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  dummy-python:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  dummy-javascript:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
