apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aggregator
resources:
  - namespace.yaml
  - workloads.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-datasource
    files:
      - prometheus.yaml
  - name: grafana-dashboards-provider
    files:
      - dashboards.yaml
  - name: grafana-dashboard-data
    files:
      - item_health_state.json
images:
  - name: ghcr.io/aleksei-sapozhnikov/catalog
    newTag: unpublished
  - name: ghcr.io/aleksei-sapozhnikov/aggregator
    newTag: unpublished
  - name: ghcr.io/aleksei-sapozhnikov/aggregator-ui
    newTag: unpublished
  - name: ghcr.io/aleksei-sapozhnikov/ai-agent
    newTag: unpublished
  - name: ghcr.io/aleksei-sapozhnikov/chaos-maker
    newTag: unpublished
  - name: ghcr.io/aleksei-sapozhnikov/dummy-java
    newTag: unpublished
  - name: ghcr.io/aleksei-sapozhnikov/dummy-python
    newTag: unpublished
  - name: ghcr.io/aleksei-sapozhnikov/dummy-javascript
    newTag: unpublished
