            memory: 256Mi
            cpu: 10m
          limits:
            memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator
spec:
  selector:
    app: aggregator
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator-ui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aggregator-ui
  template:
    metadata:
      labels:
        app: aggregator-ui
    spec:
      containers:
      - name: aggregator-ui
        image: ghcr.io/aleksei-sapozhnikov/aggregator-ui:unpublished
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: APP_TITLE
          value: "Health Aggregator K3s demo"
        - name: TIMELINE_DEFAULT_RANGE
          value: "1d"
        resources:
          requests:
            memory: 48Mi
            cpu: 10m
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /config.json
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator-ui
spec:
  selector:
    app: aggregator-ui
  ports:
  - name: http
    port: 3000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      containers:
      - name: ai-agent
        image: ghcr.io/aleksei-sapozhnikov/ai-agent:unpublished
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PRODUCT_HEALTH_BASE_URL
          value: http://aggregator:8080
        - name: AGENT_AI_ENABLED
          value: "true"
        - name: AGENT_AI_CONFIG
          value: '{"provider":"bedrock","max_tool_rounds":2,"bedrock":{"model_id":"eu.amazon.nova-lite-v1:0","aws_region":"eu-central-1","temperature":0.00001,"max_tokens":300}}'
        - name: AWS_REGION
          value: eu-central-1
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            memory: 48Mi
            cpu: 10m
          limits:
            memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
spec:
  selector:
    app: ai-agent
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-maker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chaos-maker
  template:
    metadata:
      labels:
        app: chaos-maker
    spec:
      containers:
      - name: chaos-maker
        image: ghcr.io/aleksei-sapozhnikov/chaos-maker:unpublished
        imagePullPolicy: IfNotPresent

        env:
        - name: CHAOS_ENABLED
          value: "true"
        - name: CHAOS_ALWAYS_BROKEN
          value: "true"
        - name: CHAOS_MIN_INTERVAL
          value: "30m"
        - name: CHAOS_MAX_INTERVAL
          value: "120m"
        - name: CHAOS_MIN_DURATION
          value: "5m"
        - name: CHAOS_MAX_DURATION
          value: "60m"
        - name: CHAOS_MAX_CONCURRENT
          value: "2"
        - name: CATALOG_SIGNALS_URL
          value: http://catalog:8080/api/signals/http-poll
        resources:
          requests:
            memory: 48Mi
            cpu: 10m
          limits:
            memory: 192Mi
---
