---
- name: Install pinned Aggregator GitOps Application
  ansible.builtin.template:
    src: application.yaml.j2
    dest: /opt/aggregator-manifests/aggregator-application.yaml
    owner: root
    group: root
    mode: "0644"

- name: Reconcile Aggregator Application in Argo CD
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - --namespace=argocd
      - apply
      - --filename=/opt/aggregator-manifests/aggregator-application.yaml
  register: gitops_apply
  changed_when: "'created' in gitops_apply.stdout or 'configured' in gitops_apply.stdout"
