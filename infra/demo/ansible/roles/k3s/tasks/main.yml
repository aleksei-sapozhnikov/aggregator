---
- name: Create the K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Configure the single-node K3s server
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      write-kubeconfig-mode: "0600"
      # Keep the bundled Traefik and ServiceLB enabled for IP-based HTTP ingress.
  notify: Restart K3s

- name: Download the official K3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/aggregator-install-k3s.sh
    owner: root
    group: root
    mode: "0700"

- name: Read the installed K3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: installed_k3s
  changed_when: false
  failed_when: false

- name: Install or upgrade the pinned K3s release
  ansible.builtin.command: /bin/sh /usr/local/src/aggregator-install-k3s.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  when: installed_k3s.rc != 0 or k3s_version not in installed_k3s.stdout
  notify: Restart K3s

- name: Ensure the K3s service is enabled and started
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started

- name: Apply K3s configuration changes before health checks
  ansible.builtin.meta: flush_handlers

- name: Wait for the local Kubernetes API to become ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: k3s_ready
  retries: 60
  delay: 5
  until: k3s_ready.rc == 0
  changed_when: false
