<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Grafana Frame</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        html[data-theme='dark'],
        body[data-theme='dark'] {
            background: #181b1f;
        }

        #grafana-embed {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: transparent;
        }
    </style>
</head>
<body>
<iframe id="grafana-embed" title="Grafana"></iframe>
<script src="./index.js" type="module"></script>
</body>
</html>
