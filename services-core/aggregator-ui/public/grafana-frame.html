<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Grafana Frame</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        html[data-theme='dark'],
        body[data-theme='dark'] {
            background: #181b1f;
        }

        #grafana-embed {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: transparent;
        }
    </style>
</head>
<body>
<iframe id="grafana-embed" title="Grafana"></iframe>
<script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const srcParam = params.get('src');
        const initialTarget = srcParam ? decodeURIComponent(srcParam) : '';
        const themeParam = params.get('theme');
        const iframe = document.getElementById('grafana-embed');
        let detachEscHandler = null;

        const bindEscGuard = (targetWindow) => {
            if (detachEscHandler) {
                detachEscHandler();
                detachEscHandler = null;
            }
            if (!targetWindow?.addEventListener) {
                return;
            }
            const escHandler = (event) => {
                if (event.key === 'Escape' || event.keyCode === 27) {
                    event.preventDefault();
                    event.stopPropagation();
                    if (typeof event.stopImmediatePropagation === 'function') {
                        event.stopImmediatePropagation();
                    }
                }
            };
            targetWindow.addEventListener('keydown', escHandler, true);
            detachEscHandler = () => {
                targetWindow.removeEventListener('keydown', escHandler, true);
            };
        };

        const applyTheme = (value) => {
            const nextTheme = value === 'dark' ? 'dark' : 'light';
            document.documentElement.dataset.theme = nextTheme;
            document.body.dataset.theme = nextTheme;
        };

        const applyTarget = (target) => {
            if (!target) {
                return;
            }
            try {
                if (iframe.contentWindow?.location?.replace) {
                    iframe.contentWindow.location.replace(target);
                } else {
                    iframe.src = target;
                }
            } catch (error) {
                iframe.src = target;
            }
        };

        iframe.addEventListener('load', () => {
            try {
                const innerWindow = iframe.contentWindow;
                if (!innerWindow?.history) {
                    return;
                }
                bindEscGuard(innerWindow);
                const history = innerWindow.history;
                if (history.__disableHistory) {
                    return;
                }
                const originalPushState = history.pushState.bind(history);
                const originalReplaceState = history.replaceState.bind(history);
                history.pushState = (...args) => originalReplaceState(...args);
                history.replaceState = (...args) => originalReplaceState(...args);
                history.__disableHistory = () => {
                    history.pushState = originalPushState;
                    history.replaceState = originalReplaceState;
                };
                const mousetrap = innerWindow.Mousetrap;
                if (mousetrap) {
                    mousetrap.unbindGlobal?.('esc');
                    mousetrap.unbind?.('esc');
                }
            } catch (error) {
                // Ignore cross-origin errors if Grafana is hosted elsewhere.
            }
        });

        iframe.src = 'about:blank';
        applyTheme(themeParam);
        if (initialTarget) {
            applyTarget(initialTarget);
        }

        window.addEventListener('message', (event) => {
            if (!event.data) {
                return;
            }
            if (event.data.type === 'set-frame-theme') {
                applyTheme(event.data.theme);
                return;
            }
            if (event.data.type !== 'set-grafana-src') {
                return;
            }
            const nextSrc = event.data.src;
            if (typeof nextSrc !== 'string' || nextSrc.trim() === '') {
                return;
            }
            applyTarget(nextSrc);
        });
    })();
</script>
</body>
</html>
