$schema: https://json-schema.org/draft/2020-12/schema
$id: https://aggregator.local/schemas/catalog-items.schema.yaml
title: Catalog Items
type: object
required:
  - items
additionalProperties: false
properties:
  items:
    type: array
    items:
      type: object
      required:
        - id
        - title
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
