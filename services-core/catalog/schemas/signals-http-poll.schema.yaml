$schema: https://json-schema.org/draft/2020-12/schema
$id: https://aggregator.local/schemas/signals-http-poll.schema.yaml
title: HTTP Poll Signals
type: object
required:
  - signals
additionalProperties: false
properties:
  signals:
    type: array
    items:
      type: object
      required:
        - id
        - itemId
        - url
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        itemId:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
          format: uri
        method:
          type: string
          minLength: 1
          default: GET
        timeout:
          type: string
          minLength: 1
          default: PT2S
        interval:
          type: string
          minLength: 1
          default: PT30S
