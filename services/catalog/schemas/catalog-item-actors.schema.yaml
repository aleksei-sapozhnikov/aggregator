$schema: https://json-schema.org/draft/2020-12/schema
$id: https://aggregator.local/schemas/catalog-item-actors.schema.yaml
title: Catalog Item Actors
type: object
required:
  - itemActors
additionalProperties: false
properties:
  itemActors:
    type: array
    items:
      type: object
      required:
        - itemId
        - actorId
      additionalProperties: false
      properties:
        itemId:
          type: string
          minLength: 1
        actorId:
          type: string
          minLength: 1
        isPrimary:
          type: boolean
