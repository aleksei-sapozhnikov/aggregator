р$schema: https://json-schema.org/draft/2020-12/schema
$id: https://aggregator.local/schemas/catalog-item-contacts.schema.yaml
title: Catalog Item Contacts
type: object
required:
  - itemContacts
additionalProperties: false
properties:
  itemContacts:
    type: array
    items:
      type: object
      required:
        - itemId
        - contactId
      additionalProperties: false
      properties:
        itemId:
          type: string
          minLength: 1
        contactId:
          type: string
          minLength: 1
