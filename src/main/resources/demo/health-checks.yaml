# Health checks for demo environment services
checks:
  - type: http
    checkId: payments-api-check
    catalogItemId: payments-api
    url: http://payments-api:8080/health
    method: GET
    timeout: PT2S

  - type: http
    checkId: edge-gateway-check
    catalogItemId: edge-gateway
    url: http://edge-gateway:8080/health
    method: GET
    timeout: PT2S

  - type: http
    checkId: customer-db-check
    catalogItemId: customer-db
    url: http://customer-db:8080/health
    method: GET
    timeout: PT2S
